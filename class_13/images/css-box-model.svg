<svg xmlns="http://www.w3.org/2000/svg" width="860" height="570" viewBox="0 0 860 570"><title>CSS box model: margin, border, padding, content</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="860" height="570" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >The box model</text><rect x="60" y="90" width="560" height="380" rx="0" fill="#f9cc9d" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="6 4" /><text x="70" y="112" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="start" >margin</text><rect x="100" y="130" width="480" height="300" rx="0" fill="#fddd9b" stroke="#1d1d1f" stroke-width="1.5" /><text x="110" y="145" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="start" >border</text><rect x="120" y="150" width="440" height="260" rx="0" fill="#c3d08b" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="6 4" /><text x="130" y="172" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="start" >padding</text><rect x="160" y="190" width="360" height="180" rx="0" fill="#8cb6c0" stroke="#1d1d1f" stroke-width="1.5" /><text x="340.0" y="272.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >content</text><text x="340.0" y="298.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >width × height</text><rect x="650" y="110" width="26" height="26" rx="0" fill="#f9cc9d" stroke="#1d1d1f" stroke-width="1" /><text x="686" y="129" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="start" >margin</text><text x="686" y="152" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >outside space,</text><text x="686" y="170" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >between boxes</text><rect x="650" y="190" width="26" height="26" rx="0" fill="#fddd9b" stroke="#1d1d1f" stroke-width="1" /><text x="686" y="209" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="start" >border</text><text x="686" y="232" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >the line</text><text x="686" y="250" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >around the box</text><rect x="650" y="270" width="26" height="26" rx="0" fill="#c3d08b" stroke="#1d1d1f" stroke-width="1" /><text x="686" y="289" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="start" >padding</text><text x="686" y="312" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >inside space,</text><text x="686" y="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >gets background</text><rect x="650" y="350" width="26" height="26" rx="0" fill="#8cb6c0" stroke="#1d1d1f" stroke-width="1" /><text x="686" y="369" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="start" >content</text><text x="686" y="392" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >text or image</text><text x="686" y="410" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" ></text><text x="40" y="515" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" >Default: total width = width + padding + border + margin (both sides).</text><text x="40" y="540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#5f6368" font-weight="normal" text-anchor="start" >With box-sizing: border-box, width already includes padding and border.</text></svg>