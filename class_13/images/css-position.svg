<svg xmlns="http://www.w3.org/2000/svg" width="820" height="670" viewBox="0 0 820 670"><title>position static, relative, absolute, fixed, sticky</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="820" height="670" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >position: moving a box out of the normal flow</text><rect x="40" y="80" width="240" height="270" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="55" y="110" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#1a73e8" font-weight="bold" text-anchor="start" >static</text><text x="55" y="325" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >the default: normal flow</text><text x="55" y="342" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" ></text><rect x="60" y="130" width="200" height="170" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" /><rect x="70" y="140" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="70" y="180" width="180" height="30" rx="3" fill="#1a73e8" stroke="none" stroke-width="1" fill-opacity="0.35"/><rect x="70" y="180" width="180" height="30" rx="3" fill="none" stroke="#1a73e8" stroke-width="2" /><text x="80" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#1d1d1f" font-weight="normal" text-anchor="start" >me</text><rect x="70" y="220" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="70" y="260" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="300" y="80" width="240" height="270" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="315" y="110" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#1a73e8" font-weight="bold" text-anchor="start" >relative</text><text x="315" y="325" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >nudged from where it was;</text><text x="315" y="342" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >its old space is kept</text><rect x="320" y="130" width="200" height="170" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" /><rect x="330" y="140" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="330" y="180" width="180" height="30" rx="3" fill="none" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="4 3" /><rect x="350" y="192" width="180" height="30" rx="3" fill="#1a73e8" stroke="none" stroke-width="1" fill-opacity="0.35"/><rect x="350" y="192" width="180" height="30" rx="3" fill="none" stroke="#1a73e8" stroke-width="2" /><text x="360" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#1d1d1f" font-weight="normal" text-anchor="start" >moved</text><rect x="330" y="220" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="330" y="260" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="560" y="80" width="240" height="270" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="575" y="110" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#1a73e8" font-weight="bold" text-anchor="start" >absolute</text><text x="575" y="325" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >placed inside nearest</text><text x="575" y="342" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >positioned parent</text><rect x="580" y="130" width="200" height="170" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" /><rect x="590" y="140" width="180" height="150" rx="3" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="4 3" /><text x="596" y="156" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" fill="#5f6368" font-weight="normal" text-anchor="start" >parent: relative</text><rect x="590" y="165" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="590" y="205" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="690" y="245" width="80" height="35" rx="3" fill="#1a73e8" stroke="none" stroke-width="1" fill-opacity="0.35"/><rect x="690" y="245" width="80" height="35" rx="3" fill="none" stroke="#1a73e8" stroke-width="2" /><text x="730" y="267" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >me</text><rect x="40" y="370" width="240" height="270" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="55" y="400" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#1a73e8" font-weight="bold" text-anchor="start" >fixed</text><text x="55" y="615" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >stuck to the window,</text><text x="55" y="632" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >even when scrolling</text><rect x="60" y="420" width="200" height="170" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" /><rect x="70" y="430" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="70" y="470" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="70" y="510" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="70" y="550" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="180" y="540" width="70" height="40" rx="20" fill="#1a73e8" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="215" y="565" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="white" font-weight="bold" text-anchor="middle" >chat</text><text x="265" y="510" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#5f6368" font-weight="normal" text-anchor="start" >↕</text><rect x="300" y="370" width="240" height="270" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="315" y="400" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#1a73e8" font-weight="bold" text-anchor="start" >sticky</text><text x="315" y="615" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >scrolls, then sticks</text><text x="315" y="632" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" >at top: 0</text><rect x="320" y="420" width="200" height="170" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" /><rect x="330" y="420" width="180" height="30" rx="3" fill="#1a73e8" stroke="none" stroke-width="1" fill-opacity="0.35"/><rect x="330" y="420" width="180" height="30" rx="3" fill="none" stroke="#1a73e8" stroke-width="2" /><text x="340" y="440" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#1d1d1f" font-weight="normal" text-anchor="start" >&lt;nav&gt; stuck at top</text><rect x="330" y="470" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="330" y="510" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><rect x="330" y="550" width="180" height="30" rx="3" fill="#c9c9c9" stroke="none" stroke-width="1" fill-opacity="1"/><text x="560" y="410" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" >Set the spot with:</text><text x="560" y="440" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" >top, right,</text><text x="560" y="465" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" >bottom, left</text><text x="560" y="505" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >Use flex for layout;</text><text x="560" y="528" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >position for exceptions.</text></svg>