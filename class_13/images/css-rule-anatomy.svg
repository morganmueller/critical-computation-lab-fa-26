<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"><title>Anatomy of a CSS rule</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="820" height="470" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >Anatomy of a CSS rule</text><rect x="200" y="125" width="360" height="190" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="230" y="170" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="26" xml:space="preserve"><tspan fill="#7b3fe4">p</tspan><tspan fill="#1d1d1f"> {</tspan></text><text x="230" y="215" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="26" xml:space="preserve"><tspan fill="#e8710a">  color</tspan><tspan fill="#1d1d1f">:</tspan><tspan fill="#0b8a8a"> red</tspan><tspan fill="#d81b60">;</tspan></text><text x="230" y="260" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="26" xml:space="preserve"><tspan fill="#1d1d1f">}</tspan></text><text x="230.0" y="300" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="26" xml:space="preserve"><tspan fill="#1d1d1f"></tspan></text><text x="90" y="165" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#7b3fe4" font-weight="bold" text-anchor="end" >selector</text><line x1="98" y1="160" x2="224" y2="162" stroke="#7b3fe4" stroke-width="2" marker-end="url(#arrow)"/><text x="90" y="100" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#5f6368" font-weight="normal" text-anchor="middle" >opening brace</text><line x1="110" y1="105" x2="264.4344" y2="145" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="160" y="380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#e8710a" font-weight="bold" text-anchor="middle" >property</text><line x1="170" y1="362" x2="300.43399999999997" y2="225" stroke="#e8710a" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >colon</text><line x1="380" y1="362" x2="345.8248" y2="225" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="140" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#0b8a8a" font-weight="bold" text-anchor="start" >value</text><line x1="605" y1="145" x2="394.346" y2="196" stroke="#0b8a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="240" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#d81b60" font-weight="bold" text-anchor="start" >semicolon</text><text x="610" y="262" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >ends each line</text><line x1="605" y1="233" x2="425.65" y2="212" stroke="#d81b60" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#5f6368" font-weight="normal" text-anchor="start" >closing brace</text><line x1="605" y1="325" x2="245.652" y2="262" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >One rule = selector + { property: value; } pairs. A missing ; or } breaks everything after it.</text></svg>