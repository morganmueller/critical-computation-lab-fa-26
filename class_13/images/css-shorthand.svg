<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490"><title>Margin and padding shorthand order</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="860" height="490" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >margin &amp; padding shorthand: clockwise from the top</text><rect x="120" y="190" width="220" height="160" rx="0" fill="#c3d08b" stroke="#1d1d1f" stroke-width="2" /><text x="230" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >element</text><text x="230" y="155" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#e8710a" font-weight="bold" text-anchor="middle" >1 top</text><text x="405" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#e8710a" font-weight="bold" text-anchor="middle" >2 right</text><text x="230" y="398" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#e8710a" font-weight="bold" text-anchor="middle" >3 bottom</text><text x="55" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#e8710a" font-weight="bold" text-anchor="middle" >4 left</text><path d="M290,140 A150,150 0 0 1 400,230" fill="none" stroke="#e8710a" stroke-width="3" marker-end="url(#arrow)"/><path d="M390,320 A150,150 0 0 1 300,400" fill="none" stroke="#e8710a" stroke-width="3" marker-end="url(#arrow)"/><path d="M160,400 A150,150 0 0 1 70,320" fill="none" stroke="#e8710a" stroke-width="3" marker-end="url(#arrow)"/><path d="M60,230 A150,150 0 0 1 170,140" fill="none" stroke="#e8710a" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="130" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" >padding: 20px;</text><text x="470" y="154" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >all four sides</text><text x="470" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" >padding: 10px 20px;</text><text x="470" y="224" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >top+bottom, left+right</text><text x="470" y="270" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" >padding: 10px 20px 30px;</text><text x="470" y="294" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >top, left+right, bottom</text><text x="470" y="340" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" >padding: 10px 20px 30px 40px;</text><text x="470" y="364" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >top, right, bottom, left</text><text x="40" y="460" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#5f6368" font-weight="normal" text-anchor="start" >Tip: think TRouBLe → Top, Right, Bottom, Left.</text></svg>