<svg xmlns="http://www.w3.org/2000/svg" width="820" height="575" viewBox="0 0 820 575"><title>Cascade and specificity</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="820" height="575" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >The cascade: when two rules disagree, who wins?</text><text x="40" y="80" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#5f6368" font-weight="normal" text-anchor="start" >All four set the color of the same &lt;p class=&quot;intro&quot; id=&quot;welcome&quot;&gt;</text><rect x="40" y="305" width="170" height="115" rx="8" fill="#9aa0a6" stroke="none" stroke-width="1" fill-opacity="0.18"/><rect x="40" y="305" width="170" height="115" rx="8" fill="none" stroke="#9aa0a6" stroke-width="3" /><text x="125" y="335" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#9aa0a6" font-weight="bold" text-anchor="middle" >type selector</text><text x="125" y="365" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >p {</text><text x="125" y="385" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >color: black;</text><rect x="230" y="250" width="170" height="170" rx="8" fill="#7b3fe4" stroke="none" stroke-width="1" fill-opacity="0.18"/><rect x="230" y="250" width="170" height="170" rx="8" fill="none" stroke="#7b3fe4" stroke-width="3" /><text x="315" y="280" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#7b3fe4" font-weight="bold" text-anchor="middle" >class selector</text><text x="315" y="310" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >.intro {</text><text x="315" y="330" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >color: purple;</text><rect x="420" y="195" width="170" height="225" rx="8" fill="#2e7d32" stroke="none" stroke-width="1" fill-opacity="0.18"/><rect x="420" y="195" width="170" height="225" rx="8" fill="none" stroke="#2e7d32" stroke-width="3" /><text x="505" y="225" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#2e7d32" font-weight="bold" text-anchor="middle" >id selector</text><text x="505" y="255" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >#welcome {</text><text x="505" y="275" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >color: green;</text><rect x="610" y="140" width="170" height="280" rx="8" fill="#1a73e8" stroke="none" stroke-width="1" fill-opacity="0.18"/><rect x="610" y="140" width="170" height="280" rx="8" fill="none" stroke="#1a73e8" stroke-width="3" /><text x="695" y="170" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1a73e8" font-weight="bold" text-anchor="middle" >style attribute</text><text x="695" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >style=&quot;color:</text><text x="695" y="220" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >blue&quot;</text><line x1="40" y1="450" x2="790" y2="450" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="478" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >weaker</text><text x="790" y="478" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="end" >stronger (wins)</text><text x="40" y="520" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" >Tie at the same level? The rule written LATER in the file wins.</text><text x="40" y="545" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#5f6368" font-weight="normal" text-anchor="start" >Inspect → Styles shows the losers crossed out.</text></svg>