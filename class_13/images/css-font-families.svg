<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 0 820 530"><title>Serif, sans-serif, monospace and fallback stacks</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="820" height="530" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >Generic font families</text><rect x="40" y="80" width="240" height="210" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="160" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#7b3fe4" font-weight="bold" text-anchor="middle" >serif</text><text x="160" y="190" font-family="DejaVu Serif, Georgia, serif" font-size="56" fill="#1d1d1f" text-anchor="middle">Aa ig</text><text x="160" y="235" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >Feet on the ends</text><text x="160" y="262" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="middle" >e.g. Georgia, Times</text><rect x="300" y="80" width="240" height="210" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="420" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#7b3fe4" font-weight="bold" text-anchor="middle" >sans-serif</text><text x="420" y="190" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="56" fill="#1d1d1f" text-anchor="middle">Aa ig</text><text x="420" y="235" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >No feet, clean strokes</text><text x="420" y="262" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="middle" >e.g. Helvetica, Arial, Verdana</text><rect x="560" y="80" width="240" height="210" rx="10" fill="white" stroke="#ddd" stroke-width="1" /><text x="680" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#7b3fe4" font-weight="bold" text-anchor="middle" >monospace</text><text x="680" y="190" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="56" fill="#1d1d1f" text-anchor="middle">Aa ig</text><text x="680" y="235" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >Every letter same width</text><text x="680" y="262" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="middle" >e.g. Courier, Menlo, Consolas</text><text x="40" y="340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="bold" text-anchor="start" >font-family is a priority list: the browser uses the first one it has</text><rect x="40" y="360" width="220" height="60" rx="8" fill="white" stroke="#d93025" stroke-width="2" /><text x="150" y="388" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >&quot;My Font&quot;</text><text x="150" y="410" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#d93025" font-weight="normal" text-anchor="middle" >not installed ✗</text><line x1="262" y1="390" x2="296" y2="390" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="360" width="220" height="60" rx="8" fill="white" stroke="#d93025" stroke-width="2" /><text x="410" y="388" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >Helvetica</text><text x="410" y="410" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#d93025" font-weight="normal" text-anchor="middle" >not on this computer ✗</text><line x1="522" y1="390" x2="556" y2="390" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="360" width="220" height="60" rx="8" fill="white" stroke="#2e7d32" stroke-width="2" /><text x="670" y="388" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >sans-serif</text><text x="670" y="410" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="normal" text-anchor="middle" >always exists ✓ → used</text><text x="40" y="470" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#1d1d1f" font-weight="normal" text-anchor="start" >font-family: &quot;My Font&quot;, Helvetica, sans-serif;</text><text x="40" y="500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >Always end with a generic family.</text></svg>