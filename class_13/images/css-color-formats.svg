<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500"><title>Named, hex and rgb colors with alpha</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="820" height="500" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >Three ways to write the same color</text><rect x="40" y="90" width="50" height="50" rx="6" fill="#ff0000" stroke="none" stroke-width="1" /><text x="110" y="112" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >named</text><text x="110" y="134" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20" fill="#1d1d1f" font-weight="normal" text-anchor="start" >color: red;</text><rect x="40" y="160" width="50" height="50" rx="6" fill="#ff0000" stroke="none" stroke-width="1" /><text x="110" y="182" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >hex</text><text x="110" y="204" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20" fill="#1d1d1f" font-weight="normal" text-anchor="start" >color: #ff0000;</text><rect x="40" y="230" width="50" height="50" rx="6" fill="#ff0000" stroke="none" stroke-width="1" /><text x="110" y="252" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >rgb()</text><text x="110" y="274" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20" fill="#1d1d1f" font-weight="normal" text-anchor="start" >color: rgb(255, 0, 0);</text><text x="470" y="100" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="bold" text-anchor="start" >Reading hex</text><text x="500" y="160" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="34" fill="#d93025" font-weight="bold" text-anchor="middle" >ff</text><text x="500" y="188" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#d93025" font-weight="normal" text-anchor="middle" >red</text><text x="595" y="160" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="34" fill="#2e7d32" font-weight="bold" text-anchor="middle" >00</text><text x="595" y="188" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" font-weight="normal" text-anchor="middle" >green</text><text x="690" y="160" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="34" fill="#1a73e8" font-weight="bold" text-anchor="middle" >00</text><text x="690" y="188" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#1a73e8" font-weight="normal" text-anchor="middle" >blue</text><text x="470" y="160" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="34" fill="#1d1d1f" font-weight="bold" text-anchor="start" >#</text><text x="470" y="225" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >each pair: 00 (none) → ff (full)</text><text x="470" y="247" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >ff in hex = 255 in rgb()</text><text x="40" y="320" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="bold" text-anchor="start" >Alpha (transparency): rgba(255, 0, 0, A)</text><defs><pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="white"/><rect width="8" height="8" fill="#ccc"/><rect x="8" y="8" width="8" height="8" fill="#ccc"/></pattern></defs><rect x="40" y="340" width="130" height="70" rx="6" fill="url(#chk)" stroke="none" stroke-width="1" /><rect x="40" y="340" width="130" height="70" rx="6" fill="#ff0000" stroke="none" stroke-width="1" fill-opacity="1"/><text x="105" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >A = 1</text><rect x="190" y="340" width="130" height="70" rx="6" fill="url(#chk)" stroke="none" stroke-width="1" /><rect x="190" y="340" width="130" height="70" rx="6" fill="#ff0000" stroke="none" stroke-width="1" fill-opacity="0.75"/><text x="255" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >A = 0.75</text><rect x="340" y="340" width="130" height="70" rx="6" fill="url(#chk)" stroke="none" stroke-width="1" /><rect x="340" y="340" width="130" height="70" rx="6" fill="#ff0000" stroke="none" stroke-width="1" fill-opacity="0.5"/><text x="405" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >A = 0.5</text><rect x="490" y="340" width="130" height="70" rx="6" fill="url(#chk)" stroke="none" stroke-width="1" /><rect x="490" y="340" width="130" height="70" rx="6" fill="#ff0000" stroke="none" stroke-width="1" fill-opacity="0.25"/><text x="555" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >A = 0.25</text><rect x="640" y="340" width="130" height="70" rx="6" fill="url(#chk)" stroke="none" stroke-width="1" /><rect x="640" y="340" width="130" height="70" rx="6" fill="#ff0000" stroke="none" stroke-width="1" fill-opacity="0"/><text x="705" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >A = 0</text><text x="40" y="470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5f6368" font-weight="normal" text-anchor="start" >Hex alpha adds two digits: #ff000080 ≈ 50%. Misspell a color and CSS silently ignores it.</text></svg>