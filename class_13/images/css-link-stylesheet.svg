<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640"><title>Linking one stylesheet to many pages</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="820" height="640" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >One stylesheet, many pages</text><path d="M60,90 h110 l30,30 v150 h-140 z" fill="white" stroke="#1a73e8" stroke-width="3"/><path d="M170,90 v30 h30" fill="none" stroke="#1a73e8" stroke-width="3"/><text x="130" y="300" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#1a73e8" font-weight="bold" text-anchor="middle" >index.html</text><text x="74" y="145" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#5f6368" font-weight="normal" text-anchor="start" >&lt;head&gt;</text><text x="74" y="167" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b3fe4" font-weight="normal" text-anchor="start" >  &lt;link</text><text x="74" y="189" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b3fe4" font-weight="normal" text-anchor="start" >   rel=…</text><text x="74" y="211" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b3fe4" font-weight="normal" text-anchor="start" >   href=</text><text x="74" y="233" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b3fe4" font-weight="normal" text-anchor="start" >  &quot;style.css&quot;&gt;</text><text x="74" y="255" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#5f6368" font-weight="normal" text-anchor="start" >&lt;/head&gt;</text><path d="M60,350 h110 l30,30 v150 h-