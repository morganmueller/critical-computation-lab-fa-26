<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450"><title>content-box versus border-box</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="0" y="0" width="820" height="450" rx="0" fill="#fbf8f1" stroke="none" stroke-width="1" /><text x="40" y="50" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" >box-sizing: same CSS, different size</text><text x="40" y="80" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" >width: 200px;  padding: 20px;  border: 10px solid;</text><rect x="40" y="140" width="260" height="140" rx="0" fill="#fddd9b" stroke="#1d1d1f" stroke-width="1" /><rect x="50" y="150" width="240" height="120" rx="0" fill="#c3d08b" stroke="none" stroke-width="1" /><rect x="70" y="170" width="200" height="80" rx="0" fill="#8cb6c0" stroke="none" stroke-width="1" /><text x="170.0" y="216" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >200px</text><line x1="40" y1="305" x2="300" y2="305" stroke="#1d1d1f" stroke-width="1.5"/><line x1="40" y1="298" x2="40" y2="312" stroke="#1d1d1f" stroke-width="1.5"/><line x1="300" y1="298" x2="300" y2="312" stroke="#1d1d1f" stroke-width="1.5"/><text x="170.0" y="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >260px on screen</text><text x="40" y="125" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#7b3fe4" font-weight="bold" text-anchor="start" >content-box (default)</text><text x="40" y="360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >200 + 20 + 20 + 10 + 10</text><rect x="450" y="140" width="200" height="140" rx="0" fill="#fddd9b" stroke="#1d1d1f" stroke-width="1" /><rect x="460" y="150" width="180" height="120" rx="0" fill="#c3d08b" stroke="none" stroke-width="1" /><rect x="480" y="170" width="140" height="80" rx="0" fill="#8cb6c0" stroke="none" stroke-width="1" /><text x="550.0" y="216" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >140px</text><line x1="450" y1="305" x2="650" y2="305" stroke="#1d1d1f" stroke-width="1.5"/><line x1="450" y1="298" x2="450" y2="312" stroke="#1d1d1f" stroke-width="1.5"/><line x1="650" y1="298" x2="650" y2="312" stroke="#1d1d1f" stroke-width="1.5"/><text x="550.0" y="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >200px on screen</text><text x="450" y="125" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#7b3fe4" font-weight="bold" text-anchor="start" >border-box</text><text x="450" y="360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5f6368" font-weight="normal" text-anchor="start" >content shrinks to fit</text><text x="40" y="420" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" >* { box-sizing: border-box; }  ← put this at the top of every stylesheet</text></svg>